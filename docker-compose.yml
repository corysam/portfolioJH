name: web

services:
  strapi:
    build: ./apps/cms
    container_name: strapi
    restart: always
    env_file: ./apps/cms/.env
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    networks: [db-net]

  frontend:
    build:
      context: ./apps/web
      network: host
      args:
        NEXT_PUBLIC_STRAPI_URL: https://admin.juliette-herlem.duckdns.org
        STRAPI_INTERNAL_URL: http://127.0.0.1:1337
    container_name: frontend
    restart: always
    env_file: ./apps/web/.env
    ports:
      - "127.0.0.1:3000:3000"
    networks: [db-net]

volumes:
  strapi_uploads:

networks:
  db-net:
    external: true